# Local infrastructure for the Helix backend.
#
# An explicit project name keeps these containers separate from any other
# compose stack on the machine, and the host ports are offset twice over so
# they clash with neither a host install nor another project.
name: helix

services:
  postgres:
    image: postgres:16-alpine
    container_name: helix-postgres
    environment:
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix
      POSTGRES_DB: helix
    ports:
      - "5434:5432"
    volumes:
      - helix-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helix"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: helix-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - helix-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  helix-pgdata:
  helix-redisdata:

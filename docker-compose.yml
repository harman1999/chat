# Local infrastructure for the Helix backend.
#
# An explicit project name keeps these containers separate from any other
# compose stack on the machine, and the host ports are offset twice over so
# they clash with neither a host install nor another project.
name: helix

services:
  postgres:
    image: postgres:16-alpine
    container_name: helix-postgres
    environment:
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix
      POSTGRES_DB: helix
    ports:
      - "5434:5432"
    volumes:
      - helix-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helix"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: helix-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - helix-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # A catch-all inbox for development: the app sends real SMTP to it, nothing
  # leaves the machine, and everything sent can be read at http://localhost:8026.
  mailpit:
    image: axllent/mailpit:latest
    container_name: helix-mailpit
    ports:
      - "1026:1025"   # SMTP — what the app connects to
      - "8026:8025"   # web inbox and API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # A stand-in single sign-on provider for trying the sign-in flow locally. Not
  # started by default: `docker compose --profile sso up -d mock-oidc`.
  # Issuer: http://localhost:8099/helix
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: helix-mock-oidc
    profiles: ["sso"]
    ports:
      - "8099:8080"

volumes:
  helix-pgdata:
  helix-redisdata:
